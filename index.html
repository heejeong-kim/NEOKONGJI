<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-KONGJI 2099 : 깨진 데이터의 그림자</title>
    <style>
        /* 하이테크-인더스트리얼 감성 최적화 폰트 시스템 */
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-black: #0A0A0A;
            --neon-red: #FF2A00;
            --neon-orange: #FF7F00;
            --amber-gold: #E1B12C;
            --electric-purple: #BC13FE;
            --toxic-green: #00FF88;
            --cyber-yellow: #FFEA00;
            --text-main: #FFFFFF;
            --text-dim: #A0A0A0;
            --border-opacity: rgba(255, 255, 255, 0.15);
            --nav-gray: #555555;
            /* 변수용 그린-옐로우 그라데이션 */
            --stat-grad: linear-gradient(90deg, #00FF88 0%, #FFEA00 100%);
            /* 타이틀용 레드-오렌지 그라데이션 */
            --title-grad: linear-gradient(90deg, #FF7F00 0%, #AAFF00 50%, #00FF88 100%);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            cursor: crosshair;
        }

        body {
            background-color: var(--bg-black);
            color: #FFFFFF;
            font-family: 'IBM Plex Sans KR', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 내부 타이틀 네온 점멸 모션 */
        @keyframes neon-flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                filter: drop-shadow(0 0 8px #00FF88) drop-shadow(0 0 18px #39FF14) drop-shadow(0 0 35px rgba(0, 255, 136, 0.5));
                opacity: 1;
            }
            20%, 24%, 55% {
                filter: drop-shadow(0 0 3px #00FF88);
                opacity: 0.75;
            }
        }

        @keyframes title-float-subtle {
            0% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
            100% { transform: translateY(0); }
        }

        /* --- Header --- */
        header {
            height: 60px;
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 2px solid #00FF88;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.25);
            transition: all 0.5s ease;
        }

        .header-left .title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            padding: 4px 0;
            border: none;
            background: var(--title-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
            display: inline-block;
            letter-spacing: 1.5px;
            animation: title-float-subtle 3s ease-in-out infinite, neon-flicker 5s infinite;
            cursor: pointer;
        }

        .status-master-box {
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 5px 20px;
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
        }

        .header-center-stats { display: flex; gap: 15px; font-family: 'Orbitron', sans-serif; }
        .stat-item { display: flex; flex-direction: column; align-items: center; }
        
        .stat-label { 
            font-size: 7px; 
            font-weight: 900; 
            background: var(--stat-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        
        .stat-value { font-size: 14px; color: #FFF; font-weight: bold; }
        .stat-bar { width: 45px; height: 3px; background: rgba(255, 255, 255, 0.1); margin-top: 2px; border-radius: 1px; overflow: hidden; }
        
        .stat-fill { 
            height: 100%; 
            background: var(--stat-grad); 
            transition: width 0.5s ease; 
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        .admin-key-display { 
            padding-left: 20px; 
            border-left: 1px solid rgba(255, 255, 255, 0.1); 
            font-family: 'Orbitron', sans-serif; 
            font-size: 9px; 
            font-weight: bold; 
            color: #FFFFFF;
            letter-spacing: 1px;
        }

        /* --- Main Layout --- */
        #main-body {
            flex: 1;
            display: grid;
            grid-template-columns: 8fr 2.2fr;
            padding: 15px;
            gap: 15px;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .visual-col {
            position: relative;
            border: 1px solid var(--border-opacity);
            overflow: hidden;
            background: #050505;
        }

        #scene-image { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.65); transform-origin: center center; }

        /* 대사별 이미지 전환 오버레이 */
        #scene-transition-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 4;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        /* 씬 인트로 내러티브 오버레이 */
        #narrative-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.52);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 60px;
            z-index: 8;
            opacity: 0;
            transition: opacity 0.7s ease;
            pointer-events: none;
        }
        #narrative-overlay.visible { opacity: 1; }

        #narrative-overlay-text {
            font-family: 'IBM Plex Sans KR', sans-serif;
            font-size: 1.38rem;
            font-weight: 300;
            color: #EFEFEF;
            line-height: 2.1;
            text-align: center;
            letter-spacing: 0.3px;
            white-space: pre-wrap;
            text-shadow: 0 0 24px rgba(255, 42, 0, 0.4), 0 2px 8px rgba(0,0,0,0.8);
        }


        .content-col { display: flex; flex-direction: column; gap: 10px; padding: 5px; height: 100%; overflow: hidden; }

        .scene-header-tag { 
            color: var(--neon-red); 
            font-family: 'Orbitron', sans-serif;
            font-size: 13px; 
            font-weight: 700; 
            text-transform: uppercase; 
            border-bottom: 1px solid var(--neon-red); 
            padding-bottom: 4px; 
            flex-shrink: 0; 
        }
        .scene-sub-info { 
            color: var(--text-dim); 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 11px; 
            opacity: 0.8; 
            flex-shrink: 0; 
        }

        .story-scroll-area {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin: 5px 0;
            padding-right: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-red) transparent;
        }
        .story-scroll-area::-webkit-scrollbar { width: 3px; }
        .story-scroll-area::-webkit-scrollbar-thumb { background: var(--neon-red); }

        .narrative-text { 
            font-size: 13px; 
            color: #DDD; 
            font-weight: 300;
            line-height: 1.7; 
            margin-bottom: 15px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .dialogue-box {
            border-left: 3px solid var(--electric-purple);
            padding-left: 14px;
            min-height: 120px;
        }

        .dialogue-text { color: #FFFFFF; font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
        
        .speaker-hl { color: #D6A4FF; font-weight: 700; }
        .kongji-hl { color: #FFE600; font-weight: 700; }
        .system-hl { color: #FF4D4D; font-weight: 700; }
        .patji-hl { color: #FF66FF; font-weight: 700; }
        .npc-hl { color: #00FFCC; font-weight: 700; }

        .interaction-area {
            display: flex;
            flex-direction: column;
            gap: 40px; 
            padding-top: 10px;
            border-top: 1px solid var(--border-opacity);
            flex-shrink: 0;
            background: var(--bg-black);
        }

        @keyframes ken-burns {
            0%   { transform: scale(1.0) translate(0%, 0%); }
            25%  { transform: scale(1.06) translate(-1.5%, 0.8%); }
            50%  { transform: scale(1.1) translate(1%, -1%); }
            75%  { transform: scale(1.06) translate(-0.5%, 1%); }
            100% { transform: scale(1.0) translate(0%, 0%); }
        }

        @keyframes scene-flash-in {
            0%   { opacity: 0; filter: brightness(3) saturate(0); transform: scale(1.08); }
            20%  { opacity: 1; filter: brightness(1.8) saturate(0.2); transform: scale(1.04); }
            40%  { opacity: 0.7; filter: brightness(0.4); transform: scale(1.02); }
            65%  { opacity: 1; filter: brightness(1.1); transform: scale(1.01); }
            100% { opacity: 0.65; filter: brightness(0.65); transform: scale(1.0); }
        }

        @keyframes choice-slide-in {
            from { opacity: 0; transform: translateX(30px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .choice-container { display: flex; flex-direction: column; gap: 10px; }

        .choice-item {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            border-radius: 4px;
            padding: 18px 15px;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.3s;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            opacity: 0;
        }

        .choice-item.type-a { border-color: rgba(188, 19, 254, 0.3); }
        .choice-item.type-b { border-color: rgba(255, 234, 0, 0.3); }

        .choice-item:hover { background: rgba(255, 255, 255, 0.1); transform: translateX(5px); }
        .choice-item.type-a:hover { border-color: var(--electric-purple); box-shadow: 0 0 15px var(--electric-purple); }
        .choice-item.type-b:hover { border-color: var(--cyber-yellow); box-shadow: 0 0 15px var(--cyber-yellow); }

        .choice-label { 
            font-family: 'Orbitron', sans-serif;
            font-weight: 700; 
            font-size: 13px; 
            padding: 2px 10px; 
            border-radius: 2px; 
            flex-shrink: 0; 
        }
        .type-a .choice-label { background: var(--electric-purple); color: #FFF; }
        .type-b .choice-label { background: var(--cyber-yellow); color: #000; }

        .choice-txt { font-size: 15px; font-weight: 700; color: #FFF; flex-grow: 1; word-break: keep-all; }
        .stat-delta { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #BBB; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; white-space: nowrap; }

        .nav-container { display: flex; gap: 10px; width: 100%; }
        
        .nav-btn { 
            flex: 1; 
            background: transparent; 
            border: 1px solid var(--nav-gray); 
            color: var(--text-dim); 
            font-family: 'Orbitron', sans-serif; 
            font-size: 12px; 
            padding: 12px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.3s; 
            border-radius: 2px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-btn:hover { border-color: #999; color: #FFF; background: rgba(255, 255, 255, 0.05); }
        .nav-btn.active-stop { background: #333; color: #FFF; border-color: #888; }

        .scanline-fx { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 4px; pointer-events: none; z-index: 1000; opacity: 0.1; }

        /* 스탯 변동 플래시 */
        @keyframes stat-flash-up {
            0%   { opacity: 0; transform: translateY(0px); }
            15%  { opacity: 1; transform: translateY(-6px); }
            70%  { opacity: 1; transform: translateY(-14px); }
            100% { opacity: 0; transform: translateY(-22px); }
        }
        @keyframes stat-value-pulse {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.45); }
            100% { transform: scale(1); }
        }
        .stat-delta-popup {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 900;
            pointer-events: none;
            animation: stat-flash-up 1.1s ease-out forwards;
            z-index: 500;
            white-space: nowrap;
            text-shadow: 0 0 8px currentColor;
        }
        .stat-value.flashing { animation: stat-value-pulse 0.4s ease-out; }

        /* --- Cover Screen --- */
        #cover-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('source/cover.png') no-repeat center center/cover;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #cover-screen::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: -1;
        }

        .cover-identity {
            font-family: 'IBM Plex Sans KR', sans-serif;
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        @keyframes shine-sweep {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes title-float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        @keyframes neon-scatter {
            0%, 100% {
                filter: drop-shadow(0 0 6px rgba(255, 42, 0, 0.7))
                        drop-shadow(0 0 18px rgba(255, 42, 0, 0.35))
                        drop-shadow(0 0 40px rgba(255, 42, 0, 0.15));
            }
            30% {
                filter: drop-shadow(0 0 12px rgba(255, 80, 0, 1))
                        drop-shadow(0 0 30px rgba(255, 42, 0, 0.55))
                        drop-shadow(0 0 70px rgba(255, 20, 0, 0.25));
            }
            60% {
                filter: drop-shadow(0 0 4px rgba(255, 42, 0, 0.5))
                        drop-shadow(0 0 12px rgba(255, 42, 0, 0.2))
                        drop-shadow(0 0 50px rgba(255, 42, 0, 0.3));
            }
        }

        .cover-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 10px;
            background: linear-gradient(110deg, #D8D8D8 35%, #AAAAAA 50%, #D8D8D8 65%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: title-float 4s ease-in-out infinite, shine-sweep 4s linear infinite, neon-scatter 2.5s ease-in-out infinite;
        }

        .cover-subtitle {
            font-size: 1.4rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }

        .cover-info {
            font-size: 1rem;
            color: var(--text-dim);
            margin-bottom: 40px;
            line-height: 1.8;
            max-width: 600px;
            font-weight: 300;
        }

        .cover-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 60px;
            font-family: 'Orbitron', sans-serif;
        }

        .cover-stat-label { font-size: 1.2rem; font-weight: 700; background: var(--stat-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
        .cover-stat-desc { font-size: 0.8rem; color: var(--text-dim); letter-spacing: 1px; }

        .cover-btn {
            padding: 15px 42px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 900;
            background: rgba(180, 180, 180, 0.06);
            color: #CCCCCC;
            border: 2px solid #888888;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 0 12px rgba(200, 200, 200, 0.35), inset 0 0 10px rgba(200, 200, 200, 0.05);
        }

        .cover-btn:hover {
            background: rgba(200, 200, 200, 0.08);
            color: #FFFFFF;
            border: 2px solid #BBBBBB;
            box-shadow: 0 0 30px rgba(220, 220, 220, 0.55), inset 0 0 15px rgba(220, 220, 220, 0.08);
            transform: scale(1.05);
        }

        body:not(.is-cover) #cover-screen { 
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

    </style>
</head>
<body class="is-cover">
    <div class="scanline-fx"></div>

    <!-- S0: 표지 스크린 -->
    <div id="cover-screen">
        <div class="cover-identity">[학번 넣으시고] [본인 이름]</div>
        <h1 class="cover-title">NEO KONGJI 2099</h1>
        <h2 class="cover-subtitle">: 깨진 데이터의 그림자</h2>
        <div class="cover-info">
            ID 태그가 'Frozen'으로 점멸하고 있다.<br>
            포맷까지 남은 시간은 <strong>10분</strong>.<br>
            당신의 선택이 새로운 세계의 Root가 될 것이다.
        </div>
        <div class="cover-stats">
            <div class="cover-stat-item">
                <div class="cover-stat-label" style="background: linear-gradient(90deg, #FF2A00, #FF7F00); -webkit-background-clip: text;">SYNC</div>
                <div class="cover-stat-desc">동기화율</div>
            </div>
            <div class="cover-stat-item">
                <div class="cover-stat-label" style="background: linear-gradient(90deg, #BC13FE, #E1B12C); -webkit-background-clip: text;">INTEG</div>
                <div class="cover-stat-desc">무결성</div>
            </div>
            <div class="cover-stat-item">
                <div class="cover-stat-label" style="background: linear-gradient(90deg, #FFEA00, #00FF88); -webkit-background-clip: text;">NOISE</div>
                <div class="cover-stat-desc">위험도</div>
            </div>
        </div>
        <button class="cover-btn" onclick="playClickSound(); startGame()">▶ 시스템 접속 개시</button>
    </div>

    <!-- 메인 시나리오 UI -->
    <header>
        <div class="header-left"><div class="title" onclick="goToCover()">NEO-KONGJI 2099 : 깨진 데이터의 그림자</div></div>
        <div class="status-master-box">
            <div class="header-center-stats">
                <div class="stat-item">
                    <span class="stat-label">SYNC</span>
                    <span class="stat-value" id="ui-sync">0</span>
                    <div class="stat-bar"><div class="stat-fill" id="bar-sync" style="width: 0%"></div></div>

                </div>

                    <span class="stat-label">NOISE</span>

    <main id="main-body">

                <p id="narrative-overlay-text"></p>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        /* ── 커버 앰비언스 ── */
        let coverAmbienceNodes = [];
        let coverAmbienceMaster = null;
        let coverAmbienceActive = false;

        function playCoverAmbience() {
            stopCoverAmbience();
            coverAmbienceActive = true;
            const t = audioCtx.currentTime;
            const dur = 300;

            coverAmbienceMaster = audioCtx.createGain();
            coverAmbienceMaster.gain.setValueAtTime(0, t);
            coverAmbienceMaster.gain.linearRampToValueAtTime(1.0, t + 3.5);
            coverAmbienceMaster.connect(audioCtx.destination);

            /* 1. 심층 베이스 드론 — 웅장함의 뼈대 */
            const bassFreqs = [36, 54, 72];
            bassFreqs.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(coverAmbienceMaster);
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.value = i === 0 ? 0.28 : 0.10;
                osc.start(t); osc.stop(t + dur);
                coverAmbienceNodes.push(osc);
            });

            /* 2. 디지털 패드 — 5도 적층 화음 (square → lowpass) */
            const padFreqs = [108, 162, 216, 288];
            padFreqs.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();
                osc.connect(filter); filter.connect(gain); gain.connect(coverAmbienceMaster);
                osc.type = 'square';
                osc.frequency.value = freq + (Math.random() - 0.5) * 1.5;
                filter.type = 'lowpass';

            const step = 0.52;

                choices: [

                    { speaker: '콩쥐', text: '"필연? 누군가의 존재를 지우고 고통을 주는 게 네가 말하는 고결한 계산법인가?"' },
                    { speaker: '원님', text: '"이제 판결의 권한은 너에게 있다. 시스템을 리부트하여 순수한 \'무\'로 돌릴 것인가, 아니면 이 비참한 진실을 모두에게 전파할 것인가."' },
                    { speaker: '콩쥐', text: '"판결이라니, 끝까지 오만한 태도군. 이제 내가 네 시뮬레이션 밖으로 나갈 차례다."' }
                ],
                img: 'source/S6.png',
                choices: [
                    { type: 'A', text: '시스템 전면 리부트', delta: '혁명가', s: 0, i: 0, n: 0, next: 'END_A', cond: () => state.adminKey },
                    { type: 'B', text: '진실 전파 선언', delta: '인도주의자', s: 0, i: 0, n: 0, next: 'END_B', cond: () => state.adminKey }
                ]
            },
            'END_A': { 
                id: 'FIN', title: '혁명가', location: 'LOG_FINAL', 
                narrative: '[SYSTEM LOG: 콩쥐라는 유령이 이곳을 다녀감]', 
                dialogue: [{ speaker: '시스템 로그', text: '"콩쥐라는 유령이 이곳을 다녀감."' }],
                img: 'source/END_A.png', 
                choices: [{ type: 'R', text: '서버 재접속', delta: 'RESTART', action: () => location.reload(), next: 'S1' }] 
            },
            'END_B': { 
                id: 'FIN', title: '인도주의자', location: 'DEMO_LOG', 
                narrative: '이름 없던 존재들이 자신의 로그를 되찾고, 조작된 낙원의 장막이 걷힌다.', 
                dialogue: [{ speaker: '시스템 각성', text: '"이름 없던 존재들이 자신의 로그를 되찾고, 조작된 낙원의 장막이 걷힌다."' }],
                img: 'source/END_B.png',
                choices: [{ type: 'R', text: '서버 재접속', delta: 'RESTART', action: () => location.reload(), next: 'S1' }] 
            },
            'G_OVER': { 
                id: 'DIE', title: '포맷 완료', location: 'NULL', 
                narrative: '[FORMAT COMPLETE: 당신은 애초에 존재하지 않았습니다]', 
                dialogue: [{ speaker: '시스템 메시지', text: '"[FORMAT COMPLETE: 당신은 애초에 존재하지 않았습니다]"' }],
                img: 'source/G_OVER.png',
                choices: [{ type: 'R', text: '서버 재접속', delta: 'RETRY', action: () => location.reload(), next: 'S1' }] 
            }
        };

        /* 스탯 변동 플래시 */
        function flashStatDelta(statId, barId, newVal, delta) {
            const valueEl = document.getElementById(statId);
            const barEl = document.getElementById(barId);

            /* 숫자 즉시 갱신 */
            valueEl.innerText = newVal;
            barEl.style.width = Math.min(newVal, 100) + '%';

            /* 펄스 애니메이션 */
            valueEl.classList.remove('flashing');
            void valueEl.offsetWidth;
            valueEl.classList.add('flashing');
            setTimeout(() => valueEl.classList.remove('flashing'), 450);

            if (delta === 0) return;

            /* 팝업 텍스트 (+N / -N) */
            const rect = valueEl.getBoundingClientRect();
            const popup = document.createElement('div');
            popup.className = 'stat-delta-popup';
            popup.textContent = (delta > 0 ? '+' : '') + delta;
            popup.style.color = delta > 0 ? '#00FF88' : '#FF2A00';
            popup.style.left = rect.left + 'px';
            popup.style.top  = rect.top  + 'px';
            document.body.appendChild(popup);
            popup.addEventListener('animationend', () => popup.remove());
        }

        function applyAndFlashStats(c) {
            const ns = state.sync  + (c.s || 0);
            const ni = state.integ + (c.i || 0);
            const nn = state.noise + (c.n || 0);
            flashStatDelta('ui-sync',  'bar-sync',  ns, c.s || 0);
            flashStatDelta('ui-integ', 'bar-integ', ni, c.i || 0);
            flashStatDelta('ui-noise', 'bar-noise', nn, c.n || 0);
            state.sync  = ns;
            state.integ = ni;
            state.noise = nn;
        }

        /* 화자 클래스 할당 함수 */
        function getSpeakerClass(name) {
            if (name === '콩쥐') return 'kongji-hl';
            if (name.includes('시스템') || name === 'SYSTEM' || name.includes('AI')) return 'system-hl';
            if (name === '팥쥐') return 'patji-hl';
            if (name.includes('두꺼비') || name === '선녀' || name === '원님') return 'npc-hl';
            return 'speaker-hl';
        }

        function goToCover() {
            cancelNarrativeOverlay();
            stopAlarmSound();
            stopVoiceAudio();
            if (state.typingTimeout) { clearTimeout(state.typingTimeout); state.typingTimeout = null; }
            Object.assign(state, {
                sync: 0, integ: 0, noise: 0,
                adminKey: false, helpedToad: false,
                currentScene: 'S1',
                history: [],
                isPaused: false,
                typingLineIdx: 0, typingCharIdx: 0,
                isTypingSpeaker: true, typingTimeout: null,
                choicesRendered: false, pendingChoiceRecordHistory: true
            });
            document.body.classList.add('is-cover');
            playCoverAmbience();
        }

        function startGame() {
            stopCoverAmbience();
            document.body.classList.remove('is-cover');
            state.isPaused = false;
            updateUI();
        }

        function handlePlayToggle() {
            state.isPaused = !state.isPaused;
            const btn = document.getElementById('btn-play');
            if (state.isPaused) {
                btn.innerText = 'PLAY';
                btn.classList.add('active-stop');
                stopVoiceAudio();
                if (state.typingTimeout) {
                    clearTimeout(state.typingTimeout);
                    state.typingTimeout = null;
                }
            } else {
                btn.innerText = 'STOP';
                btn.classList.remove('active-stop');
                startTypingLoop();
            }
        }

        function handleBack() {
            cancelNarrativeOverlay();
            if (state.history.length > 0) {
                const lastState = JSON.parse(JSON.stringify(state.history.pop()));
                Object.assign(state, lastState);
                updateUI();
            }
        }

        /* 고도화된 타이핑 엔진 */
        function startTypingLoop() {
            if (state.isPaused) return;

            if (state.typingTimeout) {
                clearTimeout(state.typingTimeout);
                state.typingTimeout = null;
            }

            const data = sceneData[state.currentScene];
            if (!data || state.typingLineIdx >= data.dialogue.length) {
                renderChoices();
                return;
            }

            const line = data.dialogue[state.typingLineIdx];
            const target = document.getElementById('ui-dialogue');
            
            let lineEl = target.querySelector(`[data-line="${state.typingLineIdx}"]`);
            if (!lineEl) {
                lineEl = document.createElement('div');
                lineEl.setAttribute('data-line', state.typingLineIdx);
                lineEl.style.marginBottom = '12px';
                lineEl.innerHTML = `<span class="typing-speaker"></span><span class="char-container" style="color: #FFF;"></span>`;
                target.appendChild(lineEl);
            }

            const speakerSpan = lineEl.querySelector('.typing-speaker');
            const charContainer = lineEl.querySelector('.char-container');

            if (state.isTypingSpeaker) {
                /* 새 대사 라인 시작 시점 — 이미지 전환 + 음성 트랙 확인 */
                if (state.typingCharIdx === 0) {
                    if (line.sceneImage) changeSceneImage(line.sceneImage);
                    const tracks = sceneVoiceTracks[state.currentScene];
                    if (tracks && tracks[state.typingLineIdx] !== undefined) {
                        stopVoiceAudio();
                        currentVoiceAudio = new Audio(tracks[state.typingLineIdx]);
                        duckAlarmSound(true);
                        currentVoiceAudio.addEventListener('ended', () => duckAlarmSound(false));
                        currentVoiceAudio.play().catch(() => {});
                    }
                }
                const fullSpeakerText = line.speaker + " : ";
                if (state.typingCharIdx < fullSpeakerText.length) {
                    speakerSpan.textContent += fullSpeakerText.charAt(state.typingCharIdx);
                    speakerSpan.className = `typing-speaker ${getSpeakerClass(line.speaker)}`;
                    state.typingCharIdx++;
                    state.typingTimeout = setTimeout(startTypingLoop, 40);
                } else {
                    state.isTypingSpeaker = false;
                    state.typingCharIdx = 0;
                    state.typingTimeout = setTimeout(startTypingLoop, 100);
                }
            } else {
                if (state.typingCharIdx < line.text.length) {
                    const ch = line.text.charAt(state.typingCharIdx);
                    charContainer.textContent += ch;
                    /* 공백·구두점 제외하고 소리 재생 */
                    if (ch.trim() && !/[""''.,!?…·\-]/.test(ch)) {
                        playTypingSound(line.speaker);
                    }
                    state.typingCharIdx++;
                    const scrollArea = document.getElementById('scroll-target');
                    scrollArea.scrollTop = scrollArea.scrollHeight;
                    /* 대사별 charDelay 지원 — 없으면 기본 25ms */
                    state.typingTimeout = setTimeout(startTypingLoop, line.charDelay || 25);
                } else {
                    const doneLineIdx = state.typingLineIdx;
                    state.typingLineIdx++;
                    state.typingCharIdx = 0;
                    state.isTypingSpeaker = true;

                    /* waitVoice: mp3 재생 완료 후 다음 대사 진행 */
                    if (line.waitVoice && currentVoiceAudio && !currentVoiceAudio.ended) {
                        currentVoiceAudio.onended = () => {
                            currentVoiceAudio = null;
                            if (!state.isPaused) startTypingLoop();
                        };
                    } else {
                        state.typingTimeout = setTimeout(startTypingLoop, 800);
                    }
                }
            }
        }

        function updateUI(recordHistory = true) {
            const data = sceneData[state.currentScene];
            if (!data) return;

            cancelNarrativeOverlay();
            stopAlarmSound();
            stopVoiceAudio();
            if (state.typingTimeout) {
                clearTimeout(state.typingTimeout);
                state.typingTimeout = null;
            }

            document.getElementById('ui-sync').innerText = state.sync;
            document.getElementById('bar-sync').style.width = Math.min(state.sync, 100) + '%';
            document.getElementById('ui-integ').innerText = state.integ;
            document.getElementById('bar-integ').style.width = Math.min(state.integ, 100) + '%';
            document.getElementById('ui-noise').innerText = state.noise;
            document.getElementById('bar-noise').style.width = Math.min(state.noise, 100) + '%';
            document.getElementById('ui-admin-text').innerText = `ADMIN_KEY: ${state.adminKey ? 'TRUE' : 'FALSE'}`;

            const img = document.getElementById('scene-image');
            img.style.animation = 'none';
            img.offsetHeight;
            img.src = data.img;
            img.style.animation = 'scene-flash-in 1.6s ease forwards';
            img.addEventListener('animationend', function onFlashDone() {
                img.style.animation = 'ken-burns 24s ease-in-out infinite';
                img.removeEventListener('animationend', onFlashDone);
            });
            document.getElementById('ui-scene-info').innerText = `${data.id} - ${data.title}`;
            document.getElementById('ui-location').innerText = data.location;
            document.getElementById('ui-narrative').innerText = data.narrative;
            
            document.getElementById('ui-dialogue').innerHTML = '';
            state.typingLineIdx = 0;
            state.typingCharIdx = 0;
            state.isTypingSpeaker = true;
            state.isPaused = false;
            const playBtn = document.getElementById('btn-play');
            playBtn.innerText = 'STOP'; 
            playBtn.classList.remove('active-stop');

            if (data.showNarrativeOverlay) {
                showNarrativeOverlay(data.narrative, () => startTypingLoop());
            } else {
                startTypingLoop();
            }

            const container = document.getElementById('ui-choices');
            container.innerHTML = '';
            container.style.opacity = '0';
            state.choicesRendered = false;
            state.pendingChoiceRecordHistory = recordHistory;
            document.getElementById('scroll-target').scrollTop = 0;
        }

        function renderChoices() {
            if (state.choicesRendered) return;
            state.choicesRendered = true;

            const data = sceneData[state.currentScene];
            const recordHistory = state.pendingChoiceRecordHistory;
            const container = document.getElementById('ui-choices');
            container.innerHTML = '';
            container.style.opacity = '1';
            let idx = 0;
            data.choices.forEach(c => {
                if (c.cond && !c.cond()) return;
                const item = document.createElement('div');
                item.className = `choice-item ${c.type === 'A' ? 'type-a' : (c.type === 'R' ? '' : 'type-b')}`;
                item.innerHTML = `
                    <span class="choice-label">${c.type || '>'}</span>
                    <span class="choice-txt">${c.text}</span>
                    <span class="stat-delta">${c.delta || ''}</span>
                `;
                item.style.animation = `choice-slide-in 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94) ${idx * 0.12}s forwards`;
                item.onclick = () => {
                    playClickSound();
                    if (recordHistory) state.history.push(JSON.parse(JSON.stringify({
                        sync: state.sync, integ: state.integ, noise: state.noise,
                        adminKey: state.adminKey, currentScene: state.currentScene,
                        helpedToad: state.helpedToad
                    })));
                    /* 스탯 즉시 표시 후 씬 전환 지연 */
                    applyAndFlashStats(c);
                    if (c.action) c.action();
                    state.currentScene = c.next;
                    setTimeout(() => updateUI(), 800);
                };
                container.appendChild(item);
                idx++;
            });
        }

        window.onload = () => {
            document.body.classList.add('is-cover');
            /* 마우스 움직임 감지 시 커버 앰비언스 시작 — 버튼 클릭과 충돌 없음 */
            document.getElementById('cover-screen').addEventListener('pointermove', () => {
                if (!coverAmbienceActive) playCoverAmbience();
            }, { once: true });
        };
    </script>
